<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tool Lending Library</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <header class="app-header">
    <h1>Tool Lending Library</h1>
    <p class="app-subtitle">Track, check out, and return tools from the floor.</p>
  </header>

  <main class="app-main">

    <section class="toolbar" aria-label="Search and add tools">
      <div class="field field--inline">
        <label for="search-input">Search</label>
        <input type="text" id="search-input" placeholder="Search by name or category" />
      </div>

      <div class="field field--inline">
        <label for="status-filter">Status</label>
        <select id="status-filter">
          <option value="">All</option>
          <option value="Available">Available</option>
          <option value="Checked Out">Checked Out</option>
          <option value="Under Repair">Under Repair</option>
        </select>
      </div>

      <button type="button" id="add-tool-btn" class="btn btn--primary">+ Add Tool</button>
    </section>

    <p id="status-message" class="status-message" role="status" aria-live="polite"></p>

    <div id="loading-indicator" class="loading-indicator" hidden>
      <span class="spinner" aria-hidden="true"></span>
      <span>Loading tools…</span>
    </div>

    <div id="empty-state" class="empty-state" hidden>
      <p>No tools found. Try adjusting your search, or add a new tool.</p>
    </div>

    <table class="tools-table" id="tools-table">
      <caption class="sr-only">List of tools in the lending library</caption>
      <thead>
        <tr>
          <th scope="col">Name</th>
          <th scope="col">Category</th>
          <th scope="col">Condition</th>
          <th scope="col">Status</th>
          <th scope="col">Borrower</th>
          <th scope="col">Due Date</th>
          <th scope="col">Actions</th>
        </tr>
      </thead>
      <tbody id="tools-table-body"></tbody>
    </table>

  </main>

  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title">Add Tool</h2>

      <form id="tool-form" novalidate>
        <input type="hidden" id="tool-id" />

        <div class="field">
          <label for="tool-name">Name</label>
          <input type="text" id="tool-name" name="name" required />
          <span class="field-error" id="error-name" aria-live="polite"></span>
        </div>

        <div class="field">
          <label for="tool-category">Category</label>
          <input type="text" id="tool-category" name="category" required />
          <span class="field-error" id="error-category" aria-live="polite"></span>
        </div>

        <div class="field">
          <label for="tool-condition">Condition</label>
          <select id="tool-condition" name="condition" required>
            <option value="">Select condition</option>
            <option value="New">New</option>
            <option value="Good">Good</option>
            <option value="Fair">Fair</option>
            <option value="Needs Repair">Needs Repair</option>
          </select>
          <span class="field-error" id="error-condition" aria-live="polite"></span>
        </div>

        <div class="field">
          <label for="tool-status">Status</label>
          <select id="tool-status" name="status" required>
            <option value="">Select status</option>
            <option value="Available">Available</option>
            <option value="Checked Out">Checked Out</option>
            <option value="Under Repair">Under Repair</option>
          </select>
          <span class="field-error" id="error-status" aria-live="polite"></span>
        </div>

        <div class="field" id="borrower-field">
          <label for="tool-borrower">Borrower</label>
          <input type="text" id="tool-borrower" name="borrower" />
          <span class="field-error" id="error-borrower" aria-live="polite"></span>
        </div>

        <div class="field">
          <label for="tool-due-date">Due Date</label>
          <input type="date" id="tool-due-date" name="dueDate" />
        </div>

        <div class="field">
          <label for="tool-notes">Notes (optional)</label>
          <textarea id="tool-notes" name="notes" rows="3"></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn" id="cancel-btn">Cancel</button>
          <button type="submit" class="btn btn--primary" id="save-btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
